[project]
name = "agent"
version = "0.0.1"
description = "Bene — Blair's personal AI assistant, built on LangGraph + Claude."
authors = [
    { name = "Blair Gao", email = "blairgao@gmail.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "langgraph>=1.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "click>=8.0.0",
    "websocket-client>=1.6.0",
]

[project.scripts]
bene = "agent.bene.cli:main"
neon = "agent.neon.cli:main"


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1", "pytest>=8.3.5"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent", "agent.bene", "agent.neon"]
[tool.setuptools.package-dir]
"agent" = "src/agent"
"agent.bene" = "src/agent/bene"
"agent.neon" = "src/agent/neon"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
"src/agent/bene/daemon.py" = ["T201"]
"src/agent/neon/daemon.py" = ["T201"]
"src/agent/neon/agent.py" = ["T201"]
"src/agent/neon/tools.py" = ["T201"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.5",
    "ruff>=0.8.2",
]
